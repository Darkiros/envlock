name: Build Windows exe

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:   # bouton "Run workflow" dans l'onglet Actions

permissions:
  contents: write   # nécessaire pour attacher l'exe à une Release sur tag

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm EnvLock.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnvLock-windows
          path: dist/EnvLock.exe
          if-no-files-found: error

      # Sur un tag "vX.Y.Z" : attache aussi l'exe à une Release GitHub.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EnvLock.exe
