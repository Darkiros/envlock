name: Build Windows exe

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.9.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Tidy modules
        run: go mod tidy

      - name: Build (release)
        run: wails build -platform windows/amd64 -s -skipbindings -o EnvLock.exe

      - name: Build (debug console)
        run: wails build -debug -devtools -platform windows/amd64 -s -skipbindings -o EnvLock-debug.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnvLock-windows
          path: build/bin/*.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/EnvLock.exe
