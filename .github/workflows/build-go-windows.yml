name: Build Windows exe (Go/Wails)

on:
  push:
    branches: [master, main]
    paths:
      - "go/**"
      - ".github/workflows/build-go-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Install Wails CLI
        working-directory: .
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.9.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Tidy modules
        run: go mod tidy

      - name: Build
        run: wails build -platform windows/amd64 -s -skipbindings -o EnvLock.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnvLock-go-windows
          path: go/build/bin/EnvLock.exe
          if-no-files-found: error
