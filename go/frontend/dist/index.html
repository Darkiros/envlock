<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EnvLock</title>
<style>
  :root {
    --bg:#05070d; --panel:#0b1018; --card:#141821; --line:#232a38;
    --cyan:#63d0ff; --text:#dfe9f2; --muted:#7c8ba0; --accent:#3b82f6;
    --mono:ui-monospace,"Segoe UI Mono",Consolas,monospace;
    --sans:"Segoe UI",system-ui,sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--text); font-family:var(--sans); overflow:hidden; }
  .view { position:fixed; inset:0; display:none; }
  .view.active { display:block; }

  /* ---------- Panneau de contrôle ---------- */
  #panel { display:none; flex-direction:column; }
  #panel.active { display:flex; }
  header {
    --wails-draggable:drag;
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; background:var(--panel); border-bottom:1px solid var(--line);
  }
  header .brand { font-weight:700; letter-spacing:.5px; }
  header .brand span { color:var(--cyan); }
  .winbtns { --wails-draggable:no-drag; display:flex; gap:8px; }
  .winbtns button {
    width:30px; height:26px; border:none; border-radius:7px; background:#1a1f2b;
    color:var(--muted); cursor:pointer; font-size:14px;
  }
  .winbtns button:hover { background:#242c3b; color:var(--text); }
  .winbtns .close:hover { background:#c0384b; color:#fff; }

  main { flex:1; overflow-y:auto; padding:22px; }
  .grid { display:grid; grid-template-columns:1fr 320px; gap:22px; align-items:start; }
  @media (max-width:760px){ .grid{ grid-template-columns:1fr; } }
  h2 { font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px; }
  .previewbox { background:#04060c; border:1px solid var(--line); border-radius:14px; height:220px; overflow:hidden; }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 5px; }
  input[type=password],input[type=text] {
    width:100%; background:#171b24; border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; color:var(--text); font-size:14px; outline:none;
  }
  input:focus { border-color:var(--accent); }
  .btn {
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:12px; border:none; border-radius:11px; cursor:pointer;
    font-size:15px; font-weight:600; color:#fff; background:var(--accent); margin-top:8px;
  }
  .btn:hover { background:#2f6fe0; }
  .btn:disabled { background:#2a3242; color:#5a6478; cursor:default; }
  .btn.lock { background:var(--cyan); color:#04121c; font-size:16px; }
  .btn.lock:hover { background:#8fe0ff; }
  .msg { font-size:12px; margin-top:8px; min-height:15px; color:var(--muted); }
  .msg.ok { color:#3fb950; } .msg.err { color:#ff5c6c; }
  .status { font-size:13px; color:var(--muted); }
  .status b { color:#3fb950; }

  /* ---------- Écran verrouillé ---------- */
  #lock { background:var(--bg); }
  #lockCanvas { position:absolute; inset:0; width:100%; height:100%; }
  .clock { position:absolute; top:26%; left:0; right:0; text-align:center;
    font-size:64px; font-weight:200; color:rgba(255,255,255,.92); pointer-events:none; }
  .date { position:absolute; top:calc(26% + 78px); left:0; right:0; text-align:center;
    font-size:18px; color:rgba(255,255,255,.55); pointer-events:none; }
  .hint { position:absolute; bottom:56px; left:0; right:0; text-align:center;
    font-size:13px; letter-spacing:2px; color:rgba(255,255,255,.5); }
  .pwcard {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:400px; max-width:90vw; background:rgba(20,24,33,.94); border:1px solid var(--line);
    border-radius:18px; padding:26px; display:none; backdrop-filter:blur(8px);
  }
  .pwcard.show { display:block; }
  .pwcard h3 { text-align:center; margin-bottom:16px; font-weight:600; }
  .pwcard .row { display:flex; gap:10px; margin-top:14px; }
  .pwcard .row .btn { margin-top:0; }
  .ghost { background:#1c2230; }
  .ghost:hover { background:#242c3b; }
</style>
</head>
<body>

<!-- ============ PANNEAU ============ -->
<section id="panel" class="view active">
  <header>
    <div class="brand">Env<span>Lock</span></div>
    <div class="winbtns">
      <button id="min" title="Réduire">—</button>
      <button id="close" class="close" title="Fermer">✕</button>
    </div>
  </header>
  <main>
    <div class="grid">
      <div>
        <h2>Aperçu</h2>
        <div class="previewbox"><canvas id="previewCanvas"></canvas></div>
        <button id="lockBtn" class="btn lock" style="margin-top:16px;">🔒 Verrouiller maintenant</button>
        <div class="msg" id="lockMsg"></div>
      </div>
      <div>
        <div class="card">
          <h2>Mot de passe</h2>
          <div id="pwStatus" class="status"></div>
          <div id="pwForm">
            <label>Nouveau mot de passe</label>
            <input type="password" id="pw1" placeholder="Mot de passe">
            <label>Confirmer</label>
            <input type="password" id="pw2" placeholder="Confirmer">
            <button id="savePw" class="btn">Enregistrer</button>
            <div class="msg" id="pwMsg"></div>
          </div>
        </div>
        <div class="card">
          <h2>Animation</h2>
          <div class="status">Orbe de particules (JARVIS)</div>
        </div>
      </div>
    </div>
  </main>
</section>

<!-- ============ VERROUILLAGE ============ -->
<section id="lock" class="view">
  <canvas id="lockCanvas"></canvas>
  <div class="clock" id="clock"></div>
  <div class="date" id="date"></div>
  <div class="hint">Appuyez sur Entrée pour déverrouiller</div>
  <div class="pwcard" id="pwcard">
    <h3>Environnement verrouillé</h3>
    <input type="password" id="unlockPw" placeholder="Mot de passe" style="text-align:center;">
    <div class="msg err" id="unlockMsg" style="text-align:center;"></div>
    <div class="row">
      <button class="btn ghost" id="cancelUnlock">Annuler</button>
      <button class="btn" id="doUnlock">Déverrouiller</button>
    </div>
  </div>
</section>

<script src="orb.js"></script>
<script src="app.js"></script>
</body>
</html>
